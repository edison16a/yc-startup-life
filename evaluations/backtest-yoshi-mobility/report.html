<script type="application/json" id="data">{"mode": "summary", "startup": {"name": "Yoshi Mobility", "one_liner": "Making car ownership and management frictionless.", "description": "A Nashville startup that sells car owners a membership for mobile fueling and vehicle maintenance: a van comes to the car (home or work) to fill the tank and do routine servicing such as oil changes, booked through an app. Payers are consumer car owners, and later possibly fleets and employers. Launched in spring 2016, so it enters the Summer 2016 batch with a live but early service in one metro. Described only from facts available at the start of the batch.", "as_of": "2016-06-01"}, "thresholds": [{"min": 0.65, "label": "Very likely"}, {"min": 0.45, "label": "Likely"}, {"min": 0.2, "label": "Reasonable"}, {"min": 0.05, "label": "Unlikely"}, {"min": 0.0, "label": "Very unlikely"}], "headline": "A live but asset heavy car care membership in Nashville: low odds of YC and a likely stall at seed or Series A.", "summary": "Yoshi Mobility offers car owners a membership for mobile fueling and maintenance, an idea with a very large market but thin margins and heavy operations. In mid 2016 several funded rivals existed, regulators were skeptical of fuel delivery, and the team sits outside the main startup hubs. The base rate for 2010 to 2015 YC companies shows a good chance of seed and a moderate chance of Series A, but asset heavy consumer services did worse than average. We therefore put the odds of YC acceptance near one percent, give a modest chance of Series A and treat shutdown or a small sale as the most likely end.", "yc": {"p": 0.012, "p_low": 0.005, "p_high": 0.03, "basis": "Start from the roughly 1 percent prior in yc_acceptance.md (band 0.6 to 2 percent). Up a little: the service is live with early paying members, the pain is real and universal, and the one-liner and mission are clear. Down a little: the team is based in Nashville with no obvious YC network, the model is asset heavy ( e", "traction": "National chain; said its average conventional oil change was $37", "url": "https://techcrunch.com/2012/09/11/yourmechanic-the-uber-of-car-maintenance-offers-on-demand-certified-mechanics-at-30-50-savings"}], "market_need": "The company claimed a $120B annual market for basic repair on out-of-warranty, non-luxury cars and 30 to 50 percent savings over shops; it had 10 mechanics at launch and won TechCrunch Disrupt SF 2012.", "technical": {"rating": 3, "text": "Instant pricing engine over vehicle and repair data, scheduling and mechanic vetting; mostly marketplace engineering with a data-heavy pricing component."}, "defensibility": {"rating": 2, "text": "Mechanic supply and a pricing dataset gave some edge, but mechanics could work for rivals and Wikipedia notes later quality and safety problems."}, "takeover": {"rating": 2, "text": "Incumbents did not copy it directly; Wrench, a mobile repair rival, acquired it in June 2022."}, "success": ["timing_tailwind"], "failure": [], "pivots": [{"date": "2017", "to": "Added a suite of business-to-business products", "why": "Stated on the company description; reason not sourced"}], "brand": {"rating": 3, "origin": null, "signature": "We come to you car repair; 2012 TechCrunch Disrupt SF winner", "effect": "helped", "rebrands": []}, "notes": "The 2016 round is labeled Series B by Private Equity International; month varies (Wikipedia March, an aggregator February), so only the year is given. The prior $6M or so implied by the $32M total is unexplained and a Series A was not found. A 2018 round of about $10.2M (American Family, SoftBank, Verizon; total $42.2M) appears in a Global Venturing snippet only and is unverified, and the page was not opened. Acquisition date June 2022 (one source June 2, the Wrench post June 20). The Wikipedia infobox lists John Wall as CTO against Dongyi Liao in the history; the YC page lists Liao. Founder education and prior employers were not found in sources opened.", "sources": ["http
