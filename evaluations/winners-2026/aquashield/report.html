e and distribution.", "anchor": {"base_rate": 0.22, "source": "python3 -I scripts/base_rates.py --years 2022-2025 --industry 'Real Estate and Construction': series_b cond 22% (n=9)", "adjustment_reason": "1.4x the cohort anchor because a prevention product tied to insurance savings can scale quickly once it works, and the anchor is small and censored."}, "bands": [{"raise": [10000000, 25000000], "post": [60000000, 150000000], "p_band": 0.3, "p_given_yc": 0.012473999999999999, "label": "Very unlikely", "rationale": "Thin or flat round after growth slowed, or a bridge to a priced B with weaker terms."}, {"raise": [25000000, 60000000], "post": [150000000, 450000000], "p_band": 0.5, "p_given_yc": 0.02079, "label": "Very unlikely", "rationale": "Central case: 2022+ YC Series B raises had a median near 37M to 45M."}, {"raise": [60000000, 120000000], "post": [450000000, 1200000000], "p_band": 0.2, "p_given_yc": 0.008316, "label": "Very unlikely", "rationale": "Upside band for a clear category leader, with valuations in line with the few disclosed YC Series B posts of 550M to 850M."}]}, {"key": "series_c_plus", "title": "Series C+", "months": 66, "p_reach_prev": 0.25, "p_given_yc": 0.010395, "label_given_yc": "Very unlikely", "p_today": 0.00051975, "label_today": "Very unlikely", "why": "Series C needs a national insurance or REIT scale footprint. A leak detection company can become a feature of larger building management or insurance platforms, and Alarm.com style acquirers buy such companies early, as with Doorport, which prevents a standalone growth round. Investors at this stage also look for evidence of retention and efficient growth, and a company that cannot show both usually receives only a bridge or no term sheet.", "anchor": {"base_rate": 0.36, "source": "stage_benchmarks.md all-time conditional Series C given B: 36% (n=55)", "adjustment_reason": "0.7x of that conditional rate; the RE cohort has only 2 companies at C, so I used the all-time rate and discounted for
