<script type="application/json" id="data">{"mode": "summary", "startup": {"name": "Nine Fives", "one_liner": "RF test equipment for next-gen spacecraft, drones, and cellphones", "description": "Nine Fives builds modern radio frequency test equipment and AI-ready test automation to challenge incumbents in a test and measurement market of roughly $5B in RF equipment (the founders cite $130B for all test equipment). Paying customers are hardware teams in aerospace, drones and telecom who buy instruments and want faster bring-up. A three person team in San Francisco, Spring 2026 batch.", "as_of": "2026-04-06"}, "thresholds": [{"min": 0.65, "label": "Very likely"}, {"min": 0.45, "label": "Likely"}, {"min": 0.2, "label": "Reasonable"}, {"min": 0.05, "label": "Unlikely"}, {"min": 0.0, "label": "Very unlikely"}], "headline": "A narrow, credible RF instrument could reach seed, but it must beat entrenched incumbents.", "summary": "Nine Fives is a three person hardware team aiming at the RF test market, which is large and steady but controlled by Keysight, Rohde and Schwarz and a few others. Industrials companies in recent cohorts reach seed quickly, with a median of three months, but only a minority reach Series A and the sample is small. Hardware sales cycles are long and margins depend on supply chain control, so a seed above $500K within a year is likely while later rounds are less certain. Slow and profitable paths are common for companies with paying customers, and a pivot to software or defense test systems is a plausible upside.", "yc": {"p": 0.97, "p_low": 0.9, "p_high": 0.99, "basis": "Blind test: the company is known to have been accepted, so this is a placeholder note and not an estimate. For reference the prior for a random applicant is about 1 percent (references/yc_acceptance.md) and a three person hard tech team targeting a large incumbent market would sit near the upper end of that range.", "why_it_fails": "Not applicable in this test because the company was a
