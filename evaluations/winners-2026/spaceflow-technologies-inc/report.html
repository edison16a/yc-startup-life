0e0c7e5dd379fa2d.png", "one_liner": "The future of B2B spend", "website": "https://ziphq.com/", "detail": {"depth": 2, "confidence": "high", "funding_coverage": "partial", "outcome": "Zip is one of the strongest Summer 2020 companies: an 11.1M seed in August 2020, a 43M Series B at 1.2B in May 2022, 100M at 1.5B in 2023 and 190M at 2.2B in October 2024 led by BOND, with a team around 500 and large enterprise logos. Founders with Airbnb engineering and YC partner experience, plus an intake first wedge that avoided head on replacement of Coupa and Ariba, drove growth. No failure signals were found.", "target_customer": "Large enterprise procurement, finance and IT teams that buy software and services", "business_model": "Enterprise SaaS subscription for intake to pay procurement, plus payments add ons", "rounds": [{"date": "2020-08", "stage": "Seed", "amount": 11100000, "post": null, "basis": null, "investors": ["CRV", "Y Combinator"], "url": "https://seedtable.com/companies/zip/funding-rounds/seed-2020-08"}, {"date": "2022-05", "stage": "Series B", "amount": 43000000, "post": 1200000000, "basis": "reported", "investors": ["YC Continuity", "Tiger Global", "CRV"], "url": "https://pulse2.com/zip-43-million-series-b-funding-and-1-2-billion-valuation"}, {"date": "2023-05", "stage": "Series C", "amount": 100000000, "post": 1500000000, "basis": "reported", "investors": ["Y Combinator", "CRV", "Tiger Global"], "url": "https://techcrunch.com/2023/05/16/procurement-platform-zip-raises-100m-at-a-1-5-billion-valuation/"}, {"date": "2024-10", "stage": "Series D+", "amount": 190000000, "post": 2200000000, "basis": "reported", "investors": ["BOND", "DST Global", "Adams Street", "Alkeon", "Y Combinator"], "url": "https://thepaypers.com/payments/news/zip-secures-usd-190-million-in-series-d-funding"}], "exit": {"type": "none", "date": null, "acquirer": null, "amount": null, "reason": null, "url": "https://www.ycombinator.com/companies/zip"}, "founders": [{"name": "Rujul Zaparde", "role": "CEO", "background": "Y Combinator (Visiting Partner)"}, {"name": "Lu Cheng", "role": "CTO", "background": "Airbnb (six years, most recently Head of Engineering for Airbnb Experiences)"}], "competitors_as_of": "2020-08", "competitors": [{"name": "Coupa Software", "what": "Public spend management and procurement suite", "traction": "Fiscal 2020 (year ended January 2020) revenue of 389.7M, up 50 percent; 753 customers above 100K annual subscription as of October 2019", "url": "https://www.sec.gov/Archives/edgar/data/1385867/000156459020011878/coup-10k_20200131.htm"}], "market_need": "Pandemic era software and vendor sprawl; large procurement suites were seen as heavy and slow to adopt while employees bought outside the process. Hard demand figures from 2020 were not found.", "technical": {"rating": 3, "text": "Workflow engine and many enterprise integrations (ERP, finance, security tools) built by a small team; hard part was integrations and enterprise security rather than novel research."}, "defensibility": {"rating": 3, "text": "Once embedded in approval workflows and integrated with ERP and finance systems it is costly to replace, but competing suites could add intake features."}, "takeover": {"rating": 3, "text": "A May 2026 item notes Coupa launched a competing agent orchestration product, while Zip kept winning customers and raised through 2024."}, "success": ["strong_pmf", "enterprise_sales_engine", "switching_costs", "strong_team_execution"], "failure": [], "pivots": [], "brand": {"rating": 3, "origin": "Not explained in sources. CB Insights lists the company as formerly Evergreen; the date and reason for the rename were not found.", "signature": "The Z with a rising line and the Flow and Peak motion language", "effect": "neutral", "rebrands": [{"date": "2024-10", "to": "New Flow and Peak identity with Z mark"}]}, "notes": "A Series A of about 25M to 27M (Seedtable dates it August 2021) appears in aggregator summaries but the article was not opened and the
