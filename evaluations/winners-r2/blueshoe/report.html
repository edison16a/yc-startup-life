<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueshoe: YC evaluation</title>
<style>
:root{
  --bg:#F5F0E6;--card:#FFFFFF;--ink:#14110F;--muted:#6B655C;--line:#E6DFD0;--soft:#FAF7F0;
  --orange:#F26625;--orange-soft:#FDE9DD;--blue:#2F5BEA;--blue-soft:#E4EAFD;
  --green:#1E9E5A;--green-soft:#DDF3E6;--red:#D64545;--red-soft:#FBE3E3;--amber:#D9A21B;
  --radius:18px;--shadow:0 1px 2px rgba(20,17,15,.04),0 8px 24px rgba(20,17,15,.05);
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --bg:#0E0D0C;--card:#181614;--ink:#F3EEE4;--muted:#9A9285;--line:#2A2622;--soft:#1F1C19;
  --orange-soft:#3A2417;--blue-soft:#1A2547;--green-soft:#15301F;--red-soft:#3A1C1C;--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D0C;--card:#181614;--ink:#F3EEE4;--muted:#9A9285;--line:#2A2622;--soft:#1F1C19;
  --orange-soft:#3A2417;--blue-soft:#1A2547;--green-soft:#15301F;--red-soft:#3A1C1C;--shadow:none;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit}
.app{display:grid;grid-template-columns:92px 1fr;height:100vh;height:100dvh}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 6px;border-right:1px solid var(--line);overflow-y:auto}
.brand{width:42px;height:42px;border-radius:12px;background:var(--orange);display:grid;place-items:center;margin-bottom:16px;color:#fff;font-weight:800;font-size:19px;flex:none}
.tab{all:unset;cursor:pointer;width:84px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;transition:color .25s var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--orange)}
.tab:focus-visible,.ibtn:focus-visible,.tx:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.tab svg,.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1;min-height:12px}
.ibtn{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;color:var(--muted);transition:color .2s var(--ease),transform .25s var(--ease)}
.ibtn:hover{color:var(--orange)}
.ibtn.big{width:64px;height:64px}.ibtn.big svg{width:38px;height:38px;stroke-width:1.5}
.ibtn.go{color:var(--orange)}.ibtn.go:hover{color:var(--ink);transform:translateX(3px)}
.ibtn[disabled]{opacity:.25;pointer-events:none}
.main{overflow-y:auto;scroll-behavior:smooth}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 64px}
.title{margin:0 0 22px;font-size:30px;line-height:1.15;letter-spacing:-.025em}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.view{display:none}.view.on{display:block;animation:viewin .5s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.grid>*,.chart-wrap>*,.walk>*{min-width:0}
a{overflow-wrap:anywhere}.list li>*{min-width:0;overflow-wrap:anywhere}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.rc-row{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.rc-f{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.rc-in{font:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box}
.rc-in:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.rc-out{margin-top:6px}
.card h2{margin:0 0 14px;font-size:19px;letter-spacing:-.015em}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.muted{color:var(--muted)}.small{font-size:13px}
.stat{display:flex;flex-direction:column;gap:8px;min-height:150px}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--orange);transition:stroke-dashoffset 1.2s var(--ease)}
.row{display:flex;align-items:center;gap:14px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
.stepper{display:grid;gap:4px}
.step{all:unset;cursor:pointer;display:grid;grid-template-columns:110px 1fr 140px;align-items:center;gap:14px;padding:10px 4px;transition:color .2s var(--ease)}
.step:hover b{color:var(--orange)}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:var(--orange);transition:width 1.1s var(--ease)}
.gauge{display:flex;gap:5px;margin:10px 0 0}
.gauge i{flex:1;height:10px;border-radius:5px;background:var(--line);transition:background .4s var(--ease)}
.dots{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.callout{border-radius:14px;padding:14px 16px;font-size:14px}
.callout.red{background:var(--red-soft)}.callout.green{background:var(--green-soft)}.callout.blue{background:var(--blue-soft)}
.callout b{display:block;font-size:12px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.callout.red b{color:var(--red)}.callout.green b{color:var(--green)}
.snap{scroll-snap-type:y proximity}.snap>.card{scroll-snap-align:start;scroll-margin-top:16px}
.band{display:grid;grid-template-columns:150px 1fr 70px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.band:first-of-type{border-top:0}
.range{position:relative;height:10px;border-radius:999px;background:var(--soft)}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--blue);transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tx{all:unset;cursor:pointer;padding:4px 2px;margin-left:14px;font-size:14px;font-weight:700;color:var(--muted);transition:color .2s var(--ease);border-bottom:2px solid transparent}
.tx:hover{color:var(--ink)}.tx[aria-pressed="true"]{color:var(--orange);border-bottom-color:var(--orange)}
.chart-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chart{width:100%;height:auto;touch-action:pan-y;cursor:crosshair;user-select:none}
.chart text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;fill:var(--muted)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cg{transition:opacity .35s var(--ease)}
.readout{display:flex;flex-direction:column;gap:2px;max-height:470px;overflow:auto;padding-right:2px}
.rrow{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 8px;font-size:13px;box-sizing:border-box}
.rrow .nm{font-weight:700;line-height:1.2;transition:color .2s}.rrow .st{font-size:11px;color:var(--muted)}
.rrow:hover .nm{color:var(--orange)}.rrow.sel .nm{color:var(--blue)}.rrow.me .nm{color:var(--orange)}
.rrow:focus-visible{outline:2px solid var(--blue);border-radius:8px}
.range-in{width:100%;accent-color:var(--orange);margin:10px 0 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ico{border-radius:22%;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--muted);flex:none;position:relative;font-size:12px}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico .sd{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--card)}
.acard{display:flex;flex-direction:column;gap:8px}
.cards{align-items:start}
.more{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;font-size:13px;margin-top:2px;transition:color .2s var(--ease);align-self:flex-start}
.more:hover{color:var(--orange)}.more:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.more svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.xp.open{grid-template-rows:1fr}
.xp>.xpi{overflow:hidden;min-height:0}
.detail{padding-top:6px}
.dsec{margin-top:14px}
.dsec h4{margin:0 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tl{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13px}
.tl li>span:first-child{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:2px 9px;border-radius:999px;background:var(--soft);font-size:12px}
.chips.good span{background:var(--green-soft)}.chips.bad span{background:var(--red-soft)}
.detailpanel{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:none}
.dotb{all:unset;cursor:pointer;display:block;transition:transform .2s var(--ease)}
.dotb:hover{transform:translateY(-2px)}.dotb:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.acard .head{display:flex;align-items:center;gap:10px}
.list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.list li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.list svg{width:20px;height:20px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.pro svg{stroke:var(--green)}.con svg{stroke:var(--red)}
.prob{height:8px;border-radius:999px;background:var(--soft);margin:8px 0;overflow:hidden}
.prob i{display:block;height:100%;width:0;background:var(--red);border-radius:999px;transition:width 1s var(--ease)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font-size:12px;text-align:left;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:700}details[open] summary{margin-bottom:8px}
.walk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:stretch}
.stage-chart{width:100%;height:auto}
.stage-chart text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;fill:var(--muted)}
.shake{animation:shake .6s var(--ease)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.cap{display:flex;flex-direction:column;gap:12px;min-height:520px}
.cap .num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cap .res{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.cap .ctl{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.pips{display:flex;gap:8px}.pips i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .4s var(--ease),transform .4s var(--ease)}
.pips i.on{background:var(--orange);transform:scale(1.25)}.pips i.bad{background:var(--red)}
.fadein{animation:viewin .6s var(--ease)}
.link{all:unset;cursor:pointer;color:var(--blue);font-weight:700;font-size:14px;transition:color .2s}.link:hover{color:var(--orange)}
.tree{position:relative;display:flex;gap:70px;overflow-x:auto;padding:6px 4px 18px;align-items:flex-start;min-height:340px}
.tcol{display:flex;flex-direction:column;gap:14px;min-width:230px;max-width:250px;animation:fade .4s var(--ease);flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tn{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .25s var(--ease),transform .25s var(--ease)}
.tn:hover{transform:translateY(-2px)}
.tn:focus-visible{outline:2px solid var(--blue)}
.tn.sel{border-color:var(--orange)}
.tn b{display:block;font-size:15px;line-height:1.25}
.tn .pr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.tlinks{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tlinks path{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;transition:stroke .3s}
.tlinks path.on{stroke:var(--orange)}
.rm{display:grid;gap:0;position:relative}
.rm-item{display:grid;grid-template-columns:34px 1fr;gap:16px}
.rm-rail{display:flex;flex-direction:column;align-items:center}
.rm-dot{width:16px;height:16px;border-radius:50%;background:var(--line);margin-top:26px;transition:background .4s var(--ease),transform .4s var(--ease)}
.rm-item.focus .rm-dot{background:var(--orange);transform:scale(1.3)}
.rm-line{flex:1;width:2px;background:var(--line)}.rm-item:last-child .rm-line{display:none}
.rm-item .card{margin-bottom:16px}
.rm-item.focus .card h2{color:var(--orange)}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}.chart-wrap,.walk{grid-template-columns:minmax(0,1fr)}.readout{max-height:none}.cap{min-height:0}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .nav{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 2px;background:var(--bg);overflow-x:auto}
  .brand,.spacer{display:none}.tab{width:auto;min-width:44px;flex:1;padding:8px 0 6px}.tab span{font-size:9px}
  .page{padding:20px 16px 40px}.g4,.g2{grid-template-columns:minmax(0,1fr)}.title{font-size:24px}
  .step{grid-template-columns:90px 1fr 100px}.band{grid-template-columns:1fr}.chart{min-width:640px}.chartbox{overflow-x:auto}.tbl{display:block;overflow-x:auto;max-width:100%}.tbl td,.tbl th{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.reveal{opacity:1;transform:none}.chart .ln{stroke-dashoffset:0}}
</style>

ls": "YC would most plausibly say no because a firm that owns case outcomes is a services business with contingency risk and licensing limits, not software. Reviewers would ask whether two founders include a licensed trial lawyer, how cases are sourced, and why this is not simply a lawyer using ChatGPT.", "label": "Likely"}, "stages": [{"key": "seed", "title": "Seed", "months": 8, "p_reach_prev": 0.48, "p_given_yc": 0.48, "label_given_yc": "Likely", "p_today": 0.24, "label_today": "Reasonable", "why": "The seed stalls if investors treat a two person firm as a services business: contingency fee revenue is lumpy and arrives years after a case is signed, and state rules on who may own a law firm limit equity investors. Plaintiff AI tooling vendors such as Eve and Supio raised large rounds as software, so money flows to tools rather than to firms. Spire Law, the closest firm analog, never raised past the YC deal.", "anchor": {"base_rate": 0.59, "source": "python3 -I scripts/base_rates.py --years 2022-2025 --industry B2B --calibration-only (seed 59 percent known only, 49 to 65 percent range, n=126, right censored); tag AI cohort 63 percent, n=81. The Legal tag cohort has only 2 researched companies in 2018-2021, so it is not used.", "adjustment_reason": "Window is 19.3 months, from 2025-04-07 to 2026-11-17. The anchor is an ever number; the time to milestones table (era 2022+) has a seed median of 6 months and a 75th percentile of 14 months, so most eventual seed raisers have raised by 19 months, and I take about 0.85 of the anchor. Legal AI funding is hot, but a law firm has ownership limits and a small team, so I do not lift above the anchor. The odds do not rank this company against others."}, "bands": [{"raise": [1000000, 3000000], "post": [8000000, 16000000], "p_band": 0.3, "p_given_yc": 0.144, "label": "Unlikely", "rationale": "Small post YC round under $3M from angels or a micro fund, the usual outcome when the team is small or the sector is slow. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [3000000, 6000000], "post": [16000000, 32000000], "p_band": 0.35, "p_given_yc": 0.16799999999999998, "label": "Unlikely", "rationale": "Institutional seed near the 2022+ seed median of $3.5M in the YC tables, which mixes in the YC deal so it reads low. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [6000000, 12000000], "post": [32000000, 64000000], "p_band": 0.25, "p_given_yc": 0.12, "label": "Unlikely", "rationale": "Large seed led by a top fund, as press covered 2026 rounds in the winners test (median $6.0M among confirmed raises above $1M, a sample that leans high). Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [12000000, 25000000], "post": [64000000, 130000000], "p_band": 0.1, "p_given_yc": 0.048, "label": "Very unlikely", "rationale": "Hot sector or pedigree round above $12M; rare, a small slice of the distribution. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}]}, {"key": "series_a", "title": "Series A", "months": 26, "p_reach_prev": 0.06, "p_given_yc": 0.0288, "label_given_yc": "Very unlikely", "p_today": 0.0144, "label_today": "Very unlikely", "why": "A Series A inside 19 months would need a signed case inventory with proven settlement economics, which needs a full case cycle of 18 to 36 months. Investors would also want a software layer that scales without more lawyers. Darrow reached a Series A as a data and case sourcing tool sold to firms, not as a firm itself, which shows which shape of this business gets funded.", "anchor": {"base_rate": 0.25, "source": "python3 -I scripts/base_rates.py --years 2022-2025 --industry B2B --calibration-only (series A cond 26 percent, n=74); tag AI cond 25 percent, n=51. Time to series A median 29 months from batch start, 25th percentile 22 months (B2B 2022+, n=19), so only the fast tail lands inside a 19 month window.", "adjustment_reason": "The ever anchor is 0.25. Inside a 19 month window only the fast tail of seed raisers reach a Series A, so I use about a quarter of the anchor, 0.06. This is more than 2x below the anchor because of the window, not because of company quality."}, "bands": [{"raise": [6000000, 12000000], "post": [30000000, 60000000], "p_band": 0.3, "p_given_yc": 0.00864, "label": "Very unlikely", "rationale": "Thin A with a flat or small step up on modest recurring revenue. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [12000000, 22000000], "post": [60000000, 130000000], "p_band": 0.5, "p_given_yc": 0.0144, "label": "Very unlikely", "rationale": "Typical 2022+ A: the YC table median is $15M and public deal size medians are $17M to $20M. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [22000000, 40000000], "post": [130000000, 300000000], "p_band": 0.2, "p_given_yc": 0.00576, "label": "Very unlikely", "rationale": "Upside A after a breakout year, with a platform story. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}]}, {"key": "series_b", "title": "Series B", "months": 44, "p_reach_prev": 0.25, "p_given_yc": 0.0072, "label_given_yc": "Very unlikely", "p_today": 0.0036, "label_today": "Very unlikely", "why": "A Series B needs a scalable platform with margins close to software, but a firm's profit depends on attorney hours and case outcomes. If revenue per lawyer plateaus, investors price it like a professional services company. Darrow is the benchmark that reached a B, by selling to law firms rather than being one.", "anchor": {"base_rate": 0.39, "source": "python3 -I scripts/base_rates.py --years 2018-2021 --industry B2B --calibration-only (series B cond 39 percent, n=18; 2022-2025 B2B tag AI cond 8 percent, n=13, censored). This step is an ever number, not a window number, and lies beyond the forecast window.", "adjustment_reason": "Below the 0.39 anchor at 0.64 of it: a firm model has services margins and limited investor appetite for law firm ownership, and Darrow's software shape is the route that worked."}, "bands": [{"raise": [20000000, 35000000], "post": [120000000, 220000000], "p_band": 0.3, "p_given_yc": 0.00216, "label": "Very unlikely", "rationale": "Thin B with a flat step up. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [35000000, 60000000], "post": [220000000, 500000000], "p_band": 0.5, "p_given_yc": 0.0036, "label": "Very unlikely", "rationale": "Typical B: YC 2022+ median is $40M. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [60000000, 100000000], "post": [500000000, 900000000], "p_band": 0.2, "p_given_yc": 0.00144, "label": "Very unlikely", "rationale": "Upside B led by a top growth fund. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}]}, {"key": "series_c_plus", "title": "Series C+", "months": 66, "p_reach_prev": 0.3, "p_given_yc": 0.00216, "label_given_yc": "Very unlikely", "p_today": 0.00108, "label_today": "Very unlikely", "why": "Series C and later requires a national platform in a regulated profession, and ownership rules for law firms vary by state and constrain structure. Reaching it would need a licensed entity arrangement that growth investors accept, and a repeatable intake engine in several states. Few analogs in the data come close to that.", "anchor": {"base_rate": 0.43, "source": "python3 -I scripts/base_rates.py --years 2018-2021 --industry B2B --calibration-only (series C cond 57 percent, n=7; overall cond 36 to 43 percent). Ever number, beyond the window.", "adjustment_reason": "At 0.70 of the 0.43 anchor because few law firm style companies get to growth rounds."}, "bands": [{"raise": [40000000, 70000000], "post": [250000000, 500000000], "p_band": 0.35, "p_given_yc": 0.0007559999999999999, "label": "Very unlikely", "rationale": "Thin C. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [70000000, 120000000], "post": [500000000, 1000000000], "p_band": 0.45, "p_given_yc": 0.000972, "label": "Very unlikely", "rationale": "Typical C, 2022+ YC median $74M. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}, {"raise": [120000000, 250000000], "post": [1000000000, 2500000000], "p_band": 0.2, "p_given_yc": 0.00043200000000000004, "label": "Very unlikely", "rationale": "Upside C for a category leader. Sized from the YC round size tables in references/tables/round_benchmarks.csv (2022+ rows) and public US medians from PitchBook and Carta."}]}], "outcomes": [{"name": "Shuts down or stalls", "value": null, "failure": true, "p_given_yc": 0.55, "label_given_yc": "Likely", "p_today": 0.775, "label_today": "Very likely"}, {"name": "Acquired or IPO under $100M", "value": [10000000, 100000000], "failure": false, "p_given_yc": 0.25, "label_given_yc": "Reasonable", "p_today": 0.125, "label_today": "Unlikely"}, {"name": "Acquired or IPO $100M-$1B", "value": [100000000, 1000000000], "failure": false, "p_given_yc": 0.15, "label_given_yc": "Unlikely", "p_today": 0.075, "label_today": "Unlikely"}, {"name": "Acquired or IPO over $1B", "value": [1000000000, 5000000000], "failure": false, "p_given_yc": 0.05, "label_given_yc": "Unlikely", "p_today": 0.025, "label_today": "Very unlikely"}], "outcomes_why": "Most paths end in a small practice or a stall. A two person firm can be profitable and still stay too small for venture returns, as Spire Law did. A shutdown follows if early cases settle slowly while the team pays for intake and malpractice cover, or if general AI assistants give consumers free legal answers before they need a firm.", "most_likely": {"stop_index": 0, "stop_name": "No priced round", "stop_p": 0.52, "stop_dist": [{"name": "No priced round", "p": 0.52}, {"name": "Seed", "p": 0.4512}, {"name": "Series A", "p": 0.0216}, {"name": "Series B", "p": 0.005039999999999999}, {"name": "Series C+", "p": 0.00216}], "stop_band": null, "credible_index": 1, "credible_name": "Seed", "credible_p": 0.48, "credible_band": {"raise": [3000000, 6000000], "post": [16000000, 32000000], "p_band": 0.35}}, "scores": {"need": 4, "technical": 2, "takeover": 3, "brand": 3}, "insights": {"need": {"rating": 4, "evidence": [{"claim": "Plaintiff side legal AI drew large rounds in 2024 and 2025 (Eve $47M, Supio Series A), showing firms pay for tools that raise case throughput.", "source_url": "https://www.lawnext.com/2025/01/eve-intelligent-partner-for-pi-firms-raises-47m-in-round-led-by-major-vc-firm-andreessen-horowitz.html"}, {"claim": "Personal injury firms already pay for case workflow software, the status quo that AI replaces.", "source_url": "https://legaltechnology.com/personal-injury-and-mass-tort-gen-ai-startup-supio-raises-25m-series-a/"}]}, "competition": [{"name": "Eve", "what": "AI platform for plaintiff law firms.", "traction": "Raised $47M led by a16z in January 2025.", "source_url": "https://www.lawnext.com/2025/01/eve-intelligent-partner-for-pi-firms-raises-47m-in-round-led-by-major-vc-firm-andreessen-horowitz.html"}, {"name": "Supio", "what": "Gen AI for personal injury and mass tort case work.", "traction": "Raised a $25M Series A.", "source_url": "https://legaltechnology.com/personal-injury-and-mass-tort-gen-ai-startup-supio-raises-25m-series-a/"}, {"name": "Finch", "what": "Pre litigation platform for personal injury firms.", "traction": "Launched April 2025 after a Sequoia led round.", "source_url": "https://www.builtinnyc.com/articles/finch-launches-platform-for-personal-injury-firms-20250416"}, {"name": "Status quo: traditional plaintiff firms and lead generators", "what": "Ad driven personal injury firms that buy cases and staff paralegals.", "traction": "Incumbent market with large advertising spend.", "source_url": "https://www.lawnext.com/2025/01/eve-intelligent-partner-for-pi-firms-raises-47m-in-round-led-by-major-vc-firm-andreessen-horowitz.html"}], "technical": {"rating": 2, "rationale": "The software part is a case intake and drafting app that two engineers can build in three months with current models. The hard part is not technical: it is law firm licensing, case sourcing, malpractice cover and winning cases, none of which a small team can speed up with code."}, "takeover": {"rating": 3, "who": ["Eve", "Supio", "EvenUp", "large personal injury firms"], "timeline_months": 12, "rationale": "Funded tool vendors can add consumer facing features quickly, and big firms can adopt tools themselves. A law firm model is harder to copy because of licensing, so the risk is moderate."}, "brand": {"name": "Blueshoe", "rating": 3, "effect_on_success": "neutral", "name_check": "python3 -I scripts/name_features.py --score Blueshoe --era 2022+ : kind invented_or_proper, alive 92.7 percent, n=1826", "strengths": ["Memorable and friendly, which suits a consumer front door", "Easy to say and spell"], "weaknesses": ["Says nothing about law, and a law firm needs to signal trust and seriousness"], "rationale": "The name is a plain invented compound word with no survival difference in the cohort data. Legal brands such as Darrow also use non descriptive names, so it will not decide the outcome, though a consumer law brand has to earn trust through results."}, "deep_dive": {}}, "roadmap": [{"phase": "seed", "goal": "A visible case pipeline with settled results.", "actions": ["Sign a steady flow of consumer and plaintiff matters through a compliant entity.", "Publish cycle time and settlement metrics against typical firms."], "proof": "Dozens of signed cases and the first settlements, with cost per case below the traditional average."}, {"phase": "series_a", "goal": "Show software like economics.", "actions": ["Raise revenue per lawyer through automation of intake and drafting.", "Open a second case type or state."], "proof": "Revenue per attorney well above peers with stable margins."}], "pros": [{"point": "Plaintiff AI is a funded, fast moving category", "evidence": "Eve, Supio and Finch all raised from top funds in 2024 and 2025.", "source_url": "https://www.lawnext.com/2025/01/eve-intelligent-partner-for-pi-firms-raises-47m-in-round-led-by-major-vc-firm-andreessen-horowitz.html"}, {"point": "The firm owns the customer relationship and outcome data", "evidence": "A firm gets case outcome data that tool vendors only see in part, which can power better intake and pricing."}], "cons": [{"risk": "The firm model scares equity investors and runs into ownership rules", "p": 0.35, "evidence": "Spire Law, the closest firm analog, stayed a small practice with no post YC round; money in plaintiff AI went to software vendors such as Eve and Supio.", "analogs": ["spire-law", "darrow"], "mitigation": "Build the software and data layer as a separate licensable asset and use a compliant structure with a managing attorney.", "analog_names": ["Spire Law", "Darrow"]}, {"risk": "Contingency cash arrives too slowly to fund the team", "p": 0.3, "evidence": "Personal injury cases take 12 to 36 months to settle, and intake costs are paid up front.", "analogs": ["spire-law", "cobbery"], "mitigation": "Mix fast fee consumer matters with plaintiff cases and use litigation finance
