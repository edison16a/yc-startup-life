<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptless: YC evaluation</title>
<style>
:root{
  --bg:#F5F0E6;--card:#FFFFFF;--ink:#14110F;--muted:#6B655C;--line:#E6DFD0;--soft:#FAF7F0;
  --orange:#F26625;--orange-soft:#FDE9DD;--blue:#2F5BEA;--blue-soft:#E4EAFD;
  --green:#1E9E5A;--green-soft:#DDF3E6;--red:#D64545;--red-soft:#FBE3E3;--amber:#D9A21B;
  --radius:18px;--shadow:0 1px 2px rgba(20,17,15,.04),0 8px 24px rgba(20,17,15,.05);
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --bg:#0E0D0C;--card:#181614;--ink:#F3EEE4;--muted:#9A9285;--line:#2A2622;--soft:#1F1C19;
  --orange-soft:#3A2417;--blue-soft:#1A2547;--green-soft:#15301F;--red-soft:#3A1C1C;--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D0C;--card:#181614;--ink:#F3EEE4;--muted:#9A9285;--line:#2A2622;--soft:#1F1C19;
  --orange-soft:#3A2417;--blue-soft:#1A2547;--green-soft:#15301F;--red-soft:#3A1C1C;--shadow:none;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit}
.app{display:grid;grid-template-columns:92px 1fr;height:100vh;height:100dvh}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 6px;border-right:1px solid var(--line);overflow-y:auto}
.brand{width:42px;height:42px;border-radius:12px;background:var(--orange);display:grid;place-items:center;margin-bottom:16px;color:#fff;font-weight:800;font-size:19px;flex:none}
.tab{all:unset;cursor:pointer;width:84px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;transition:color .25s var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--orange)}
.tab:focus-visible,.ibtn:focus-visible,.tx:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.tab svg,.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1;min-height:12px}
.ibtn{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;color:var(--muted);transition:color .2s var(--ease),transform .25s var(--ease)}
.ibtn:hover{color:var(--orange)}
.ibtn.big{width:64px;height:64px}.ibtn.big svg{width:38px;height:38px;stroke-width:1.5}
.ibtn.go{color:var(--orange)}.ibtn.go:hover{color:var(--ink);transform:translateX(3px)}
.ibtn[disabled]{opacity:.25;pointer-events:none}
.main{overflow-y:auto;scroll-behavior:smooth}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 64px}
.title{margin:0 0 22px;font-size:30px;line-height:1.15;letter-spacing:-.025em}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.view{display:none}.view.on{display:block;animation:viewin .5s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.grid>*,.chart-wrap>*,.walk>*{min-width:0}
a{overflow-wrap:anywhere}.list li>*{min-width:0;overflow-wrap:anywhere}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.rc-row{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.rc-f{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.rc-in{font:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box}
.rc-in:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.rc-out{margin-top:6px}
.card h2{margin:0 0 14px;font-size:19px;letter-spacing:-.015em}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.muted{color:var(--muted)}.small{font-size:13px}
.stat{display:flex;flex-direction:column;gap:8px;min-height:150px}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--orange);transition:stroke-dashoffset 1.2s var(--ease)}
.row{display:flex;align-items:center;gap:14px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
.stepper{display:grid;gap:4px}
.step{all:unset;cursor:pointer;display:grid;grid-template-columns:110px 1fr 140px;align-items:center;gap:14px;padding:10px 4px;transition:color .2s var(--ease)}
.step:hover b{color:var(--orange)}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:var(--orange);transition:width 1.1s var(--ease)}
.gauge{display:flex;gap:5px;margin:10px 0 0}
.gauge i{flex:1;height:10px;border-radius:5px;background:var(--line);transition:background .4s var(--ease)}
.dots{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.callout{border-radius:14px;padding:14px 16px;font-size:14px}
.callout.red{background:var(--red-soft)}.callout.green{background:var(--green-soft)}.callout.blue{background:var(--blue-soft)}
.callout b{display:block;font-size:12px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.callout.red b{color:var(--red)}.callout.green b{color:var(--green)}
.snap{scroll-snap-type:y proximity}.snap>.card{scroll-snap-align:start;scroll-margin-top:16px}
.band{display:grid;grid-template-columns:150px 1fr 70px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.band:first-of-type{border-top:0}
.range{position:relative;height:10px;border-radius:999px;background:var(--soft)}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--blue);transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tx{all:unset;cursor:pointer;padding:4px 2px;margin-left:14px;font-size:14px;font-weight:700;color:var(--muted);transition:color .2s var(--ease);border-bottom:2px solid transparent}
.tx:hover{color:var(--ink)}.tx[aria-pressed="true"]{color:var(--orange);border-bottom-color:var(--orange)}
.chart-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chart{width:100%;height:auto;touch-action:pan-y;cursor:crosshair;user-select:none}
.chart text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;fill:var(--muted)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cg{transition:opacity .35s var(--ease)}
.readout{display:flex;flex-direction:column;gap:2px;max-height:470px;overflow:auto;padding-right:2px}
.rrow{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 8px;font-size:13px;box-sizing:border-box}
.rrow .nm{font-weight:700;line-height:1.2;transition:color .2s}.rrow .st{font-size:11px;color:var(--muted)}
.rrow:hover .nm{color:var(--orange)}.rrow.sel .nm{color:var(--blue)}.rrow.me .nm{color:var(--orange)}
.rrow:focus-visible{outline:2px solid var(--blue);border-radius:8px}
.range-in{width:100%;accent-color:var(--orange);margin:10px 0 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ico{border-radius:22%;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--muted);flex:none;position:relative;font-size:12px}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico .sd{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--card)}
.acard{display:flex;flex-direction:column;gap:8px}
.cards{align-items:start}
.more{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;font-size:13px;margin-top:2px;transition:color .2s var(--ease);align-self:flex-start}
.more:hover{color:var(--orange)}.more:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.more svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.xp.open{grid-template-rows:1fr}
.xp>.xpi{overflow:hidden;min-height:0}
.detail{padding-top:6px}
.dsec{margin-top:14px}
.dsec h4{margin:0 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tl{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13px}
.tl li>span:first-child{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:2px 9px;border-radius:999px;background:var(--soft);font-size:12px}
.chips.good span{background:var(--green-soft)}.chips.bad span{background:var(--red-soft)}
.detailpanel{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:none}
.dotb{all:unset;cursor:pointer;display:block;transition:transform .2s var(--ease)}
.dotb:hover{transform:translateY(-2px)}.dotb:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.acard .head{display:flex;align-items:center;gap:10px}
.list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.list li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.list svg{width:20px;height:20px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.pro svg{stroke:var(--green)}.con svg{stroke:var(--red)}
.prob{height:8px;border-radius:999px;background:var(--soft);margin:8px 0;overflow:hidden}
.prob i{display:block;height:100%;width:0;background:var(--red);border-radius:999px;transition:width 1s var(--ease)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font-size:12px;text-align:left;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:700}details[open] summary{margin-bottom:8px}
.walk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:stretch}
.stage-chart{width:100%;height:auto}
.stage-chart text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;fill:var(--muted)}
.shake{animation:shake .6s var(--ease)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.cap{display:flex;flex-direction:column;gap:12px;min-height:520px}
.cap .num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cap .res{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.cap .ctl{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.pips{display:flex;gap:8px}.pips i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .4s var(--ease),transform .4s var(--ease)}
.pips i.on{background:var(--orange);transform:scale(1.25)}.pips i.bad{background:var(--red)}
.fadein{animation:viewin .6s var(--ease)}
.link{all:unset;cursor:pointer;color:var(--blue);font-weight:700;font-size:14px;transition:color .2s}.link:hover{color:var(--orange)}
.tree{position:relative;display:flex;gap:70px;overflow-x:auto;padding:6px 4px 18px;align-items:flex-start;min-height:340px}
.tcol{display:flex;flex-direction:column;gap:14px;min-width:230px;max-width:250px;animation:fade .4s var(--ease);flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tn{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .25s var(--ease),transform .25s var(--ease)}
.tn:hover{transform:translateY(-2px)}
.tn:focus-visible{outline:2px solid var(--blue)}
.tn.sel{border-color:var(--orange)}
.tn b{display:block;font-size:15px;line-height:1.25}
.tn .pr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.tlinks{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tlinks path{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;transition:stroke .3s}
.tlinks path.on{stroke:var(--orange)}
.rm{display:grid;gap:0;position:relative}
.rm-item{display:grid;grid-template-columns:34px 1fr;gap:16px}
.rm-rail{display:flex;flex-direction:column;align-items:center}
.rm-dot{width:16px;height:16px;border-radius:50%;background:var(--line);margin-top:26px;transition:background .4s var(--ease),transform .4s var(--ease)}
.rm-item.focus .rm-dot{background:var(--orange);transform:scale(1.3)}
.rm-line{flex:1;width:2px;background:var(--line)}.rm-item:last-child .rm-line{display:none}
.rm-item .card{margin-bottom:16px}
.rm-item.focus .card h2{color:var(--orange)}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}.chart-wrap,.walk{grid-template-columns:minmax(0,1fr)}.readout{max-height:none}.cap{min-height:0}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .nav{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 2px;background:var(--bg);overflow-x:auto}
  .brand,.spacer{display:none}.tab{width:auto;min-width:44px;flex:1;padding:8px 0 6px}.tab span{font-size:9px}
  .page{padding:20px 16px 40px}.g4,.g2{grid-template-columns:minmax(0,1fr)}.title{font-size:24px}
  .step{grid-template-columns:90px 1fr 100px}.band{grid-template-columns:1fr}.chart{min-width:640px}.chartbox{overflow-x:auto}.tbl{display:block;overflow-x:auto;max-width:100%}.tbl td,.tbl th{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.reveal{opacity:1;transform:none}.chart .ln{stroke-dashoffset:0}}
</style>
</head>

<script type="application/json" id="data">{"mode": "summary", "startup": {"name": "Promptless", "one_liner": "An AI teammate that automatically updates your customer-facing docs", "description": "AI agent that updates customer facing documentation from feature releases, support tickets and internal Slack conversations, and works with any docs platform. Used by startups and larger companies. Team of 5 in San Francisco.", "as_of": "2025-01-06"}, "thresholds": [{"min": 0.65, "label": "Very likely"}, {"min": 0.45, "label": "Likely"}, {"min": 0.2, "label": "Reasonable"}, {"min": 0.05, "label": "Unlikely"}, {"min": 0.0, "label": "Very unlikely"}], "headline": "A narrow docs agent with a thin budget category; seed odds track the anchor over a long 22 month window.", "summary": "Promptless is an AI agent that updates customer facing docs from releases, tickets and Slack. Over a 22.3 month window the B2B cohort anchor gives a seed probability near 0.54, and I report 0.52. Series A inside the same window is about 0.10. Documentation tooling has many entrants and a small budget, and the same wedge produced FifthTry, which died after a seed. The company has a team of five and claims enterprise users, which helps but does not rank it.", "yc": {"p": 0.99, "p_low": 0.97, "p_high": 0.995, "basis": "The company is already in the batch that starts at the as_of date, so the acceptance step is reported only for completeness: the prior for a random applicant is about 1 percent (0.6 to 2 percent), and conditional on being accepted the forecast below is what matters. Team of 5 with enterprise customers claimed suggests real usage; ideas in developer tools get interest but the wedge is narrow.", "why_it_fails": "YC would most plausibly pass because documentation maintenance looks like a feature rather than a company: docs platforms such as Mintlify and GitBook already offer update agents, coding assistants can draft doc changes inside the repository, and the budget owner is unclear between
