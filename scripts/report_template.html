<html lang="en">

<style>

}

  --bg:#0E0D0C;--card:#181614;--ink:#F3EEE4;--muted:#9A9285;--line:#2A2622;--soft:#1F1C19;
  --orange-soft:#3A2417;--blue-soft:#1A2547;--green-soft:#15301F;--red-soft:#3A1C1C;--amber-soft:#3A2F12;--shadow:none;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:88px 1fr;height:100vh;height:100dvh}
.nav{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-right:1px solid var(--line)}
.brand{width:44px;height:44px;border-radius:14px;background:var(--orange);display:grid;place-items:center;margin-bottom:18px;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.02em}
.tab{all:unset;cursor:pointer;width:68px;padding:10px 0 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:600;transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--ease)}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tab[aria-selected="true"]{background:var(--orange-soft);color:var(--orange)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}
.main{overflow-y:auto;scroll-behavior:smooth}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 64px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.025em}
.top p{margin:6px 0 0;color:var(--muted);max-width:760px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.icon-btn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:transform .2s var(--ease)}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.view{display:none}.view.on{display:block;animation:viewin .5s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
.card h2{margin:0 0 14px;font-size:19px;letter-spacing:-.015em}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.muted{color:var(--muted)}.small{font-size:13px}
.stat{display:flex;flex-direction:column;gap:8px;min-height:176px}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--orange);transition:stroke-dashoffset 1.2s var(--ease)}
.row{display:flex;align-items:center;gap:14px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
.stepper{display:grid;gap:10px}
.step{all:unset;cursor:pointer;display:grid;grid-template-columns:110px 1fr 120px;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;transition:background .2s var(--ease)}
.step:hover{background:var(--soft)}
.step:focus-visible{outline:2px solid var(--blue)}
.bar{height:12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:var(--orange);transition:width 1.1s var(--ease)}
.gauge{display:flex;gap:5px;margin:10px 0 8px}
.gauge i{flex:1;height:10px;border-radius:5px;background:var(--line);transition:background .4s var(--ease)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.dot img{width:100%;height:100%;object-fit:cover}

.callout.red b{color:var(--red)}.callout.green b{color:var(--green)}.callout.blue b{color:var(--blue)}

.range{position:relative;height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.range i{position:absolute;top:-1px;bottom:-1px;border-radius:999px;background:var(--blue);transform-origin:left;animation:grow .9s var(--ease) both}

.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);transition:all .2s var(--ease)}

.seg button:focus-visible{outline:2px solid var(--blue)}
.chart-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chart{width:100%;height:auto;touch-action:pan-y;cursor:crosshair;user-select:none}
.chart text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;fill:var(--muted)}

.rrow .nm{font-weight:700;line-height:1.2}.rrow .st{font-size:11px;color:var(--muted)}

.range-in{width:100%;accent-color:var(--orange);margin:10px 0 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.list li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.list svg{width:20px;height:20px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.pro svg{stroke:var(--green)}.con svg{stroke:var(--red)}
.prob{height:8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);margin:8px 0;overflow:hidden}
.prob i{display:block;height:100%;width:0;background:var(--red);border-radius:999px;transition:width 1s var(--ease)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font-size:12px;text-align:left;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}

  .brand,.spacer,.nav .icon-btn{display:none}.tab{width:auto;flex:1;padding:8px 0 6px}

</style>
